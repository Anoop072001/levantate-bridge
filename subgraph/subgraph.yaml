specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: TaskEscrow
    network: arc-testnet
    source:
      address: "0x4f75bea0a2d3a8e494161f115ecdcb9f18175806"
      abi: TaskEscrow
      startBlock: 61137121
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Task
        - Bid
        - Worker
        - Payment
        - MissedDeadline
      abis:
        - name: TaskEscrow
          file: ./abis/TaskEscrow.json
      eventHandlers:
        - event: TaskPosted(indexed uint256,indexed address,uint256,uint256,uint256,uint256,string)
          handler: handleTaskPosted
        - event: BidPlaced(indexed uint256,indexed uint256,indexed address,uint256,uint256)
          handler: handleBidPlaced
        - event: WorkerAssigned(indexed uint256,indexed uint256,indexed address,uint256,uint256,uint256)
          handler: handleWorkerAssigned
        - event: WorkSubmitted(indexed uint256,indexed address,bytes32,uint256)
          handler: handleWorkSubmitted
        - event: WorkRejected(indexed uint256,indexed address,uint256,uint256)
          handler: handleWorkRejected
        - event: PaymentReleased(indexed uint256,indexed address,indexed address,uint256,uint256,uint256)
          handler: handlePaymentReleased
        - event: TaskReclaimed(indexed uint256,indexed address,uint256,uint256)
          handler: handleTaskReclaimed
        - event: TaskCancelled(indexed uint256,indexed address,uint256,uint256)
          handler: handleTaskCancelled
      file: ./src/task-escrow.ts
